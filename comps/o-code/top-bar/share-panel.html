<template page>
  <l-m src="/gh/ofajs/Punch-UI/packages/dialog/dialog.html"></l-m>
  <style>
    :host {
      display: block;
    }

    .container {
      padding: 0 1px;
      max-width: 60vw;
      min-width: 40vw;
      cursor: default;
    }

    .link-container {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline, #ccc);
      border-radius: 6px;
      padding: 8px 12px;
      max-width: 60vw;
      margin: 0 0 16px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .warning-container {
      text-align: center;
      padding: 20px 0;
    }

    .warning-icon {
      font-size: 48px;
      color: var(--md-sys-color-error, #f44336);
      margin-bottom: 16px;
    }

    .warning-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin: 0 0 8px;
    }

    .warning-hint {
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant, #666);
      margin: 0;
    }
  </style>
  <p-dialog :open="open" on:click-mask="open = false">
    <div slot="title">
      <locale-text>
        <span lang="cn">分享代码</span>
        <span lang="en">Share Code</span>
      </locale-text>
    </div>
    <div class="container">
      <o-if :value="tooLarge">
        <div class="warning-container">
          <n-icon icon="material-symbols:warning" class="warning-icon"></n-icon>
          <p class="warning-text">
            <locale-text>
              <span lang="cn">项目代码过大，无法通过链接分享</span>
              <span lang="en">Project code is too large to share via link</span>
            </locale-text>
          </p>
          <p class="warning-hint">
            <locale-text>
              <span lang="cn">请下载项目文件，然后分享给他人</span>
              <span lang="en">Please download the project files and share them</span>
            </locale-text>
          </p>
          <p-button variant="filled" on:click="clickDownload" style="margin-top: 12px;">
            <n-icon slot="prefix" icon="material-symbols:download"></n-icon>
            <locale-text>
              <span lang="cn">下载项目</span>
              <span lang="en">Download Project</span>
            </locale-text>
          </p-button>
        </div>
      </o-if>
      <o-else>
        <p>
          <locale-text>
            <span lang="cn">你可以直接复制以下链接分享给他人</span>
            <span lang="en"
              >You can copy the link below to share with others</span
            >
          </locale-text>
        </p>
        <div class="link-container">{{ shareLink }}</div>
        <p-button
          variant="outlined"
          size="small"
          on:click="clickCopy"
          attr:disabled="copied"
          attr:color="copied ? 'success' : 'primary'"
        >
          <x-if :value="!copied">
            <locale-text>
              <span lang="cn">复制链接</span>
              <span lang="en">Copy Link</span>
            </locale-text>
          </x-if>
          <x-else>
            <n-icon slot="prefix" icon="ix:success"></n-icon>
            <locale-text>
              <span lang="cn">已复制</span>
              <span lang="en">Copied</span>
            </locale-text>
          </x-else>
        </p-button>
      </o-else>
    </div>
  </p-dialog>
  <o-consumer
    name="o-code"
    watch:project-handle-path="projectPath"
  ></o-consumer>
  <script>
    export default async ({ load }) => {
      const { compress } = await load("../../util.js");
      const { get } = await load("/nos/fs/main.js");
      const { toast } = await load("/gh/ofajs/Punch-UI/packages/util.js");
      const { download } = await load("/nos/fs/download.js");

      return {
        data: {
          shareLink: "",
          projectPath: "",
          open: null,
          tooLarge: false,
          compressedSize: 0,
          copied: false,
        },
        watch: {
          open(open) {
            if (open) {
              this.loadCode();
            }
          },
        },
        proto: {
          async clickCopy() {
            await navigator.clipboard.writeText(this.shareLink);
            this.copied = true;
            setTimeout(() => {
              this.copied = false;
            }, 1000);
          },
          async clickDownload() {
            const handle = await get(this.projectPath);
            download(handle);
            this.open = false;
          },
          async loadCode() {
            const projectHandle = await get(this.projectPath);

            const files = [];
            const skipDirs = ["node_modules", ".git"];
            const skipNames = [".git", ".DS_Store", "Thumbs.db"];

            const processDir = async (dirHandle, basePath) => {
              for await (let handle of dirHandle.values()) {
                if (
                  handle.name.startsWith(".") ||
                  skipDirs.includes(handle.name)
                ) {
                  continue;
                }

                if (handle.kind === "file") {
                  const content = await handle.text();
                  files.push({
                    p: handle.path.replace(this.projectPath + "/", ""),
                    c: content,
                  });
                } else if (handle.kind === "dir") {
                  await processDir(handle, handle.path);
                }
              }
            };

            await processDir(projectHandle, this.projectPath);

            const data = {
              files,
              active: files[0].p,
            };

            const compressedStr = await compress(JSON.stringify(data));

            let origin = "https://playground.ofajs.com";

            if (location.origin.includes("localhost")) {
              origin = location.origin;
            }

            // 大于 8kb，提醒可能会分享失败
            if (compressedStr.length > 8192 - 100) {
              // toast("项目代码大小超过 8kb，可能会分享失败");
              this.tooLarge = true;
              this.compressedSize = compressedStr.length;
            }

            this.shareLink = `${origin}/?redirect=w&d=${compressedStr}`;
          },
        },
        attached() {},
      };
    };
  </script>
</template>
